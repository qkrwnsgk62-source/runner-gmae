<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>쿠키 러너 (Cookie Runner)</title>
    <meta name="description" content="달콤한 쿠키가 되어 장애물을 피하고 젤리와 코인을 모으는 모바일 러닝 액션 게임!" />
    <meta property="og:title" content="쿠키 러너 (Cookie Runner)" />
    <meta property="og:description" content="달콤한 쿠키가 되어 장애물을 피하고 젤리와 코인을 모으는 모바일 러닝 액션 게임!" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN (GitHub Pages Zero-Build Static Ready) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              slate: {
                850: '#151f32',
              }
            }
          }
        }
      }
    </script>
    <style>
      * {
        touch-action: manipulation;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0c0817;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      @keyframes popIn {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-pop-in {
        animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body class="w-full h-[100dvh] flex flex-col bg-[#0c0817] text-slate-100 overflow-hidden select-none">
    
    <!-- TOP MINI HEADER (Mobile Compact HUD Bar) -->
    <header class="w-full h-12 bg-slate-950/80 backdrop-blur-md border-b border-white/10 px-3 flex items-center justify-between shrink-0 z-30">
      <div class="flex items-center gap-2">
        <span class="text-xl">🍪</span>
        <span class="font-extrabold text-sm tracking-tight text-white">쿠키 러너</span>
      </div>

      <div class="flex items-center gap-2">
        <!-- Coin Pill -->
        <div class="flex items-center gap-1 px-2.5 py-1 bg-amber-950/40 border border-amber-500/40 rounded-full text-amber-300 font-mono font-bold text-xs">
          <span>🪙</span>
          <span id="hudTopCoins">0</span>
        </div>

        <!-- Shop Button -->
        <button class="btn-open-shop flex items-center gap-1 px-2.5 py-1 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 rounded-lg text-xs font-bold shadow-sm shadow-amber-500/30 transition-transform active:scale-95 cursor-pointer">
          <span>🛒</span>
          <span>상점</span>
        </button>

        <!-- Sound Toggle -->
        <button id="btnMute" class="w-8 h-8 flex items-center justify-center bg-slate-850 border border-slate-700 text-slate-300 rounded-lg text-xs active:bg-slate-750 transition-colors cursor-pointer" title="음소거 토글">
          🔊
        </button>
      </div>
    </header>

    <!-- MAIN GAME AREA (Full Viewport Canvas Container) -->
    <main class="flex-1 w-full relative flex flex-col overflow-hidden bg-black">
      
      <!-- Canvas Wrapper (Scales cleanly in 16:9 or responsive stretch) -->
      <div class="w-full h-full relative flex items-center justify-center overflow-hidden">
        <canvas id="gameCanvas" width="960" height="540" class="w-full h-full object-contain block cursor-pointer"></canvas>

        <!-- FLOATING TOP HUD (During gameplay) -->
        <div id="hudTop" class="hidden absolute top-2 left-2 right-2 flex items-center justify-between pointer-events-none z-20">
          <div class="flex items-center gap-3 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/15 text-xs">
            <div class="flex flex-col">
              <span class="text-slate-400 text-[10px]">점수</span>
              <span id="hudScore" class="font-bold font-mono tabular-nums text-white text-sm">0</span>
            </div>
            <div class="w-px h-5 bg-white/20"></div>
            <div class="flex flex-col">
              <span class="text-slate-400 text-[10px]">거리</span>
              <span id="hudDistance" class="font-bold font-mono tabular-nums text-cyan-300 text-sm">0m</span>
            </div>
            <div class="w-px h-5 bg-white/20"></div>
            <div class="flex flex-col">
              <span class="text-slate-400 text-[10px]">코인</span>
              <span class="font-bold font-mono tabular-nums text-amber-300 text-sm flex items-center gap-0.5">
                <span>🪙</span>
                <span id="hudCoins">0</span>
              </span>
            </div>
          </div>

          <!-- Active Powerup Badges -->
          <div id="activePowerupsList" class="flex items-center gap-1.5"></div>

          <!-- In-game Pause Button -->
          <button id="btnPause" class="pointer-events-auto w-8 h-8 flex items-center justify-center bg-black/60 backdrop-blur-md border border-white/20 text-white rounded-xl text-xs active:scale-95 cursor-pointer">
            ⏸
          </button>
        </div>

        <!-- OVERLAY: TITLE MENU -->
        <div id="titleMenu" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-4 text-center z-20">
          <div class="w-16 h-16 rounded-2xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-3xl mb-3 shadow-lg shadow-amber-500/20">
            🍪
          </div>

          <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-1">
            쿠키 러너
          </h1>
          <p class="text-xs text-amber-200/80 max-w-xs mb-5">
            달콤한 쿠키와 함께 장애물을 피하고 젤리와 코인을 모으세요!
          </p>

          <div class="flex flex-col w-full max-w-xs gap-2.5 mb-4">
            <button id="btnStartGame" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 active:scale-98 text-slate-950 font-extrabold text-base rounded-xl shadow-lg shadow-amber-500/30 flex items-center justify-center gap-2 cursor-pointer transition-all">
              <span>▶</span>
              <span>게임 시작</span>
            </button>

            <button class="btn-open-shop w-full py-2.5 bg-slate-800/90 active:bg-slate-700 text-white font-bold text-xs rounded-xl border border-slate-700 flex items-center justify-center gap-1.5 cursor-pointer">
              <span>🛒</span>
              <span>쿠키 상점 & 강화</span>
            </button>
          </div>

          <!-- Controls Mini Tip -->
          <div class="flex items-center gap-4 text-[11px] text-slate-400 bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-800">
            <span>왼쪽: <b>슬라이딩</b></span>
            <span>·</span>
            <span>오른쪽: <b>점프/2단점프</b></span>
          </div>
        </div>

        <!-- OVERLAY: PAUSE -->
        <div id="pauseOverlay" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-4 text-center z-20">
          <h2 class="text-2xl font-bold text-white mb-1">일시 정지</h2>
          <p class="text-xs text-slate-400 mb-5">잠시 숨을 고르고 계속 달리세요!</p>

          <div class="flex flex-col w-full max-w-xs gap-2.5">
            <button id="btnResume" class="w-full py-3 bg-amber-500 hover:bg-amber-400 active:scale-98 text-slate-950 font-bold text-sm rounded-xl flex items-center justify-center gap-2 cursor-pointer">
              <span>▶</span>
              <span>계속 달리기</span>
            </button>
            <button id="btnPauseRestart" class="w-full py-2.5 bg-slate-800 active:bg-slate-700 text-white font-medium text-xs rounded-xl border border-slate-700 flex items-center justify-center gap-1.5 cursor-pointer">
              <span>🔄</span>
              <span>처음부터 다시</span>
            </button>
            <button class="btn-open-shop w-full py-2.5 bg-slate-850 active:bg-slate-750 text-amber-300 font-medium text-xs rounded-xl border border-slate-700 flex items-center justify-center gap-1.5 cursor-pointer">
              <span>🛒</span>
              <span>상점 열기</span>
            </button>
          </div>
        </div>

        <!-- OVERLAY: GAME OVER -->
        <div id="gameOverOverlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-4 text-center z-20 animate-pop-in">
          <div id="highScoreBadge" class="hidden px-3 py-1 bg-amber-500/20 border border-amber-500/50 text-amber-300 font-bold text-xs rounded-full mb-2 animate-bounce">
            🎉 최고 기록 달성!
          </div>

          <h2 class="text-2xl sm:text-3xl font-extrabold text-rose-400 mb-1">장애물 충돌!</h2>
          <p class="text-xs text-slate-400 mb-4">쿠키가 오븐의 열기를 버티지 못했습니다.</p>

          <div class="grid grid-cols-3 gap-2 w-full max-w-xs bg-slate-900/90 border border-slate-800 rounded-xl p-3 mb-5">
            <div class="flex flex-col items-center">
              <span class="text-slate-400 text-[10px]">최종 점수</span>
              <span id="goScore" class="text-lg font-bold font-mono text-white tabular-nums">0</span>
            </div>
            <div class="flex flex-col items-center border-x border-slate-800">
              <span class="text-slate-400 text-[10px]">달린 거리</span>
              <span id="goDistance" class="text-lg font-bold font-mono text-cyan-300 tabular-nums">0m</span>
            </div>
            <div class="flex flex-col items-center">
              <span class="text-slate-400 text-[10px]">모은 코인</span>
              <span id="goCoins" class="text-lg font-bold font-mono text-amber-300 tabular-nums">+0</span>
            </div>
          </div>

          <div class="flex flex-col w-full max-w-xs gap-2.5">
            <button id="btnRestartGame" class="w-full py-3.5 bg-amber-500 hover:bg-amber-400 active:scale-98 text-slate-950 font-extrabold text-sm rounded-xl shadow-lg shadow-amber-500/30 flex items-center justify-center gap-2 cursor-pointer">
              <span>🔄</span>
              <span>다시 달리기</span>
            </button>
            <button class="btn-open-shop w-full py-2.5 bg-slate-850 active:bg-slate-750 text-white font-bold text-xs rounded-xl border border-slate-700 flex items-center justify-center gap-1.5 cursor-pointer">
              <span>🛒</span>
              <span>쿠키 상점 & 능력 강화</span>
            </button>
          </div>
        </div>

      </div>

      <!-- BOTTOM TOUCH CONTROLS (Cookie Run Mobile 2-Thumb Layout) -->
      <div class="w-full h-20 bg-slate-950/95 border-t border-white/10 px-4 py-2 flex items-center justify-between gap-4 shrink-0 z-30">
        
        <!-- Left Thumb: SLIDE BUTTON -->
        <button id="btnTouchSlide" class="flex-1 h-full bg-gradient-to-t from-slate-900 to-slate-850 active:from-amber-950 active:to-amber-900 border-2 border-slate-700 active:border-amber-400 rounded-2xl flex items-center justify-center gap-2 text-white font-extrabold text-base shadow-md transition-all active:scale-95 cursor-pointer">
          <span class="text-amber-400 text-xl font-black">↓</span>
          <span>슬라이딩</span>
        </button>

        <!-- Right Thumb: JUMP BUTTON -->
        <button id="btnTouchJump" class="flex-1 h-full bg-gradient-to-t from-amber-600 to-amber-500 active:from-amber-500 active:to-amber-400 border-2 border-amber-400/80 active:border-white rounded-2xl flex items-center justify-center gap-2 text-slate-950 font-extrabold text-base shadow-lg shadow-amber-500/25 transition-all active:scale-95 cursor-pointer">
          <span class="text-slate-950 text-xl font-black">↑</span>
          <span>점프</span>
        </button>
      </div>

    </main>

    <!-- MODAL: COOKIE SHOP & UPGRADES (Opens upon clicking Shop Button) -->
    <div id="shopModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-2xl w-full max-w-lg max-h-[85vh] overflow-y-auto shadow-2xl p-5 text-slate-100 flex flex-col animate-pop-in">
        
        <!-- Modal Top Bar -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-800 sticky top-0 bg-slate-900 z-10">
          <div class="flex items-center gap-2.5">
            <span class="text-xl">🛒</span>
            <h2 class="text-base font-bold text-white">쿠키 상점 & 강화</h2>
            <div id="shopCoins" class="px-2.5 py-0.5 bg-amber-500/20 border border-amber-500/40 rounded-full text-amber-300 font-mono font-bold text-xs">
              0 코인
            </div>
          </div>
          <button class="btn-close-modal w-8 h-8 rounded-full bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center text-sm cursor-pointer">
            ✕
          </button>
        </div>

        <!-- Section 1: Cookie Characters (All purchasable with in-game coins) -->
        <div class="mt-4">
          <h3 class="text-xs font-bold text-amber-300 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
            <span>🍪</span>
            <span>쿠키 캐릭터 구매 및 선택</span>
          </h3>
          <div id="shopSkinsContainer" class="space-y-2.5"></div>
        </div>

        <!-- Section 2: Permanent Upgrades -->
        <div class="mt-5 mb-2">
          <h3 class="text-xs font-bold text-cyan-300 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
            <span>✨</span>
            <span>영구 능력치 강화</span>
          </h3>
          <div class="space-y-2">
            <div id="upgrade_magnetDuration" class="flex items-center justify-between p-2.5 bg-slate-850/60 border border-slate-800 rounded-xl"></div>
            <div id="upgrade_shieldDuration" class="flex items-center justify-between p-2.5 bg-slate-850/60 border border-slate-800 rounded-xl"></div>
            <div id="upgrade_coinValue" class="flex items-center justify-between p-2.5 bg-slate-850/60 border border-slate-800 rounded-xl"></div>
          </div>
        </div>

        <!-- Modal Bottom Close -->
        <div class="pt-3 mt-4 border-t border-slate-800 flex justify-end">
          <button class="btn-close-modal w-full py-2.5 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-bold text-xs rounded-xl cursor-pointer">
            확인 및 게임으로 돌아가기
          </button>
        </div>
      </div>
    </div>

    <!-- Script Entry Point -->
    <script src="./script.js"></script>
  </body>
</html>
